<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TruCost</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>TruCost</h1>
    <p class="tag">What does it really cost you? Not in money, in life.</p>
  </header>

  <form id="form" class="card" autocomplete="off">
    <h2>What are you buying?</h2>
    <div class="row">
      <label>Price (£)<input id="price" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 1200"></label>
      <label>How often
        <select id="frequency">
          <option value="once">One-off</option>
          <option value="monthly">Per month, for life</option>
          <option value="yearly">Per year, for life</option>
        </select>
      </label>
    </div>

    <h2>You</h2>
    <div class="row">
      <label>Age<input id="age" type="number" min="16" max="110" inputmode="numeric" placeholder="e.g. 45"></label>
      <label>Sex (for life expectancy)
        <select id="sex">
          <option value="average">Prefer not to say</option>
          <option value="male">Male</option>
          <option value="female">Female</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Annual salary before tax (£)<input id="gross" type="number" min="0" step="any" inputmode="decimal" placeholder="e.g. 55000"></label>
      <label>Paid hours per week<input id="hours" type="number" min="1" max="100" step="any" inputmode="decimal" value="40"></label>
    </div>

    <details>
      <summary>Fine-tune (optional)</summary>
      <div class="row">
        <label>Commute and work-related hours per week<input id="commute" type="number" min="0" step="any" inputmode="decimal" value="5"></label>
        <label>Holiday weeks per year<input id="holiday" type="number" min="0" max="30" step="any" inputmode="decimal" value="5"></label>
      </div>
      <div class="row">
        <label>Other deductions, % of salary (pension, student loan)<input id="otherPct" type="number" min="0" max="60" step="any" inputmode="decimal" value="0"></label>
        <label>Retirement age<input id="retire" type="number" min="40" max="90" inputmode="numeric" value="67"></label>
        <label>Expected age at death (leave blank to estimate)<input id="lifeExp" type="number" min="20" max="120" inputmode="numeric" placeholder="auto"></label>
      </div>
    </details>
  </form>

  <button id="run" type="button" form="form">Calculate true cost</button>

  <section class="card" id="result" aria-live="polite" hidden>
    <div class="big" id="bigNumber"></div>
    <div class="sub" id="bigSub"></div>
    <dl id="details"></dl>
  </section>

  <footer>
    <p>Draft v0.2. Tax is a UK estimate (England, Wales, NI). Life expectancy is a rough estimate, not a prediction. Nothing you enter leaves your device.</p>
  </footer>
</main>
<script src="calc.js"></script>
<script src="app.js"></script>
</body>
</html>
